//	============================================
//	BERD Waterfall Support
//	============================================



//	BE4
@PART[BE4]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
	!EFFECTS,* {}
	!MODULE[EngineLightEffect] {}
	!MODULE[ModuleWaterfallFX] {}
	ROWaterfall
	{
		template = be4-lower-1
		audio = pump-fed-heavy-1
		transform = thrustTransform
		position = 0,0,0
        rotation = 180, 0, 0
        scale = 1.072, 1.072, 1.072
		ExtraTemplate
		{
			template = waterfall-nozzle-glow-blue-1
			position = 0,0,0.016
			rotation = 0, 0, 0
			scale = 1.44, 1.44, 0.0016
		}
	}
	@MODULE[ModuleEnginesFX],*
	{
		@runningEffectName = running
	}
}



