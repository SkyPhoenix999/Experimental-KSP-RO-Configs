//	================================================================================
//	RO Waterfall Configs
//	================================================================================


//	TQ-12
@PART[TQ12]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
	@MODULE[ModuleEnginesFX],*
	{
		@runningEffectName = running
	}
	!MODULE[ModuleWaterfallFX],* {}
	ROWaterfall
	{
		template = tq-12-lower-1
		audio = pump-fed-medium-1
		position = 0,0,0
        rotation = 0, 0, 0
        scale = 0.5, 0.5, 0.5
        @position[*] *= #$/rescaleFactor$
        @scale[*] *= #$/rescaleFactor$
		ExtraTemplate
		{
			template = waterfall-nozzle-glow-blue-1
	    	position = 0,0,-0.01
            rotation = 0, 0, 0
            scale = 0.45, 0.45, 1
            @position[*] *= #$/rescaleFactor$
            @scale[*] *= #$/rescaleFactor$
		}
	}
}


