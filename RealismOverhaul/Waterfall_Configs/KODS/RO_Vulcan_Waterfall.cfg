//	GEM-63XL
@PART[KODSbluedog_AtlasV_GEM63|KODSbluedog_AtlasV_GEM63XL]:NEEDS[Waterfall,!Bluedog_DB]
{
	!EFFECTS,* {}
	!MODULE[ModuleWaterfallFX],* {}
	ROWaterfall
	{
		template = rowaterfall-hybrid-srm-1
		useHybrid = true
		audio = srm-2
		position = 0,0,0
		rotation = 0, 0, 0
		scale = 1.857375, 1.857375, 1.857375
		glow = ro-srm
	}
}


//	BE-4
@PART[BE4]:BEFORE[ROWaterfall]:NEEDS[Waterfall,!BERD]
{
	!MODULE[ModuleWaterfallFX],* {}
	ROWaterfall
	{
		template = BE4Plume
		audio = pump-fed-heavy-1
		position = 0,0,0
		rotation = 0, 0, 0
		scale = 1.42, 1.42, 1.42
		glow = waterfall-nozzle-glow-blue-1
	}
}


//	Centaur Engine Mount
@PART[CentaurVMount]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
	!EFFECTS,* {}
	!MODULE[ModuleWaterfallFX],* {}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = RCS
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
			thrusterTransformName = rcsTransform
		}
		TEMPLATE
		{
			templateName = rowaterfall-rcs-hypergolic-1
			overrideParentTransform = rcsTransform
			position = 0,0,0
			rotation = 0, 0, 180
			scale = 0.6, 1.2, 0.6
		}
	}
}


//	Heavy Nosecone
@PART[VulcanCone]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
	ROWaterfall
	{
		template = rowaterfall-srm-vac-1
		audio = srm-1
		transform = thrustTransform
		position = 0,0,0
		rotation = 0, 10, 0
		scale = 0.076, 0.076, 0.3
		ExtraTemplate
		{
			template = rowaterfall-glow-srm
			position = 0,0,0.015
			rotation = 0, 10, 0
			scale = 0.13, 0.13, 0.01
		}
	}
}