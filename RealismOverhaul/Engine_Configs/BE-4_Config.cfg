//	==================================================
//	BE-4 global engine configuration.
//
//	Manufacturer: Blue Origin
//
//	=================================================================================
//	BE-4
//	Vulcan, New Glenn 7x2
//
//	Dry Mass: 2250 Kg
//	Thrust (SL): 2200.29 kN
//	Thrust (Vac): 2460 kN (~550klbf)
//	ISP: 305 SL / 341 Vac
//	Burn Time: 400
//	Chamber Pressure: 13.4 MPa
//	Propellant: LOX / CH4
//	Prop Ratio: 3.6
//	Throttle: 40% to 100%
//	Nozzle Ratio: 40
//	Ignitions: 4
//	=================================================================================
//	BE-4 [640klbf]
//	Vulcan, New Glenn
//
//	Dry Mass: 2250 Kg
//	Thrust (SL): 2846.86 kN
//	Thrust (Vac): 3182.88 kN (640klbf)
//	ISP: 305 SL / 341 Vac
//	Burn Time: 400
//	Chamber Pressure: 13.4 MPa
//	Propellant: Cooled LOX / Cooled CH4
//	Prop Ratio: 3.6
//	Throttle: 40% to 100%
//	Nozzle Ratio: 40
//	Ignitions: 4
//	=================================================================================

//	Sources:

//	Blue Origin - BE-4 engine:																https://www.blueorigin.com/be4
//	Blue Origin - Upgraded Engines and Subcooled Components Drive Enhanced Performance:		https://www.blueorigin.com/news/new-glenn-upgraded-engines-subcooled-components-drive-enhanced-performance
//	United Launch Alliance - BE-4 rocket engine:											http://www.ulalaunch.com/uploads/docs/BE-4_Fact_Sheet_Web_Final_2.pdf
//	Space Launch Report - Vulcan launch vehicle:											http://www.spacelaunchreport.com/vulcan.html
//	NASASpaceFlight - IAF Blue Origin presentation: 										https://forum.nasaspaceflight.com/index.php?topic=10685.msg1665037#msg1665037

//	Used by:

//	ROEngines
//	BERD
//	ProvenanceAerospace

//	Notes:

//	* Preliminary config as no solid information about the operational parameters of the engine have been released yet.
//	* WIP Config Subject to New Info/Specs
//	==================================================

@PART[*]:HAS[#engineType[BE4]]:FOR[RealismOverhaulEngines]
{
	%category = Engine
	%title = #roBE4Title	//BE-4
	%manufacturer = #roMfrBO
	%description = #roBE4Desc	//The BE-4 is an oxidizer-rich staged combustion methalox engine. Though initially developed for use on a Blue Origin launch vehicle, United Launch Alliance announced in 2014 that their new Vulcan launch vehicle will be powered by a pair of BE-4 engines.

	@tags ^= :$: USA blue origin bo ula be-4 new glenn vulcan liquid pump booster lqdhydrogen lqdoxygen

	%specLevel = prototype

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	@MODULE[ModuleGimbal],*
	{
		@gimbalRange = 8.0 // Guess, same as RD-180.
		%useGimbalResponseSpeed = True
		%gimbalResponseSpeed = 16
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = BE-4
		origMass = 2.25

		CONFIG
		{
			name = BE-4
			specLevel = operational
			minThrust = 984
			maxThrust = 2460
			heatProduction = 100
			massMult = 1.0
			ullage = True
			pressureFed = False
			ignitions = 4
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			PROPELLANT
			{
				name = LqdMethane
				ratio = 0.4268
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.5732
				DrawGauge = False
			}
			atmosphereCurve
			{
				key = 0 341
				key = 1 305
			}
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 1590	//Assume same as RD-180
				ratedBurnTime = 400
				safeOverburn = true
				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.98
				ignitionReliabilityEnd = 0.995
				cycleReliabilityStart = 0.98
				cycleReliabilityEnd = 0.995
			}
		}
		CONFIG
		{
			name = BE-4 [640klbf]
			description = Higher thrust variant of the BE-4 with higher thrust being phased in on NG-3.
			specLevel = prototype
			minThrust = 1273.15
			maxThrust = 3182.88
			heatProduction = 100
			massMult = 1.0
			ullage = True
			pressureFed = False
			ignitions = 4
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			PROPELLANT
			{
				name = CooledLqdMethane
				ratio = 0.4268
				DrawGauge = True
			}
			PROPELLANT
			{
				name = CooledLqdOxygen
				ratio = 0.5732
				DrawGauge = False
			}
			atmosphereCurve
			{
				key = 0 341
				key = 1 305
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 1590	//Assume same as RD-180
				ratedBurnTime = 400
				safeOverburn = true
				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.98
				ignitionReliabilityEnd = 0.995
				cycleReliabilityStart = 0.98
				cycleReliabilityEnd = 0.995
				techTransfer = BE-4:50
			}
		}
	}
}
