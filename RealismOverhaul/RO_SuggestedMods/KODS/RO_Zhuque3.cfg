//	Interstage
@PART[ZQ3Interstage]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.63636
	@title = Zhuque-3 Interstage
	@manufacturer = #roMfrLS
	%skinTempTag = Steel
	%internalTempTag = Steel
	@MODULE[ModuleDecouple]
	{
		@ejectionForce = 1500
	}
	!RESOURCE,* {}
	MODULE
	{
		name = ModuleFuelTanks
		type = SM-IV
		volume = 801
		basemass = -1
		TANK
		{
			name = Nitrogen
			amount = 160000
			maxAmount = 160000
		}
		TANK
		{
			name = ElectricCharge
			amount = 1000
			maxAmount = 1000
		}
	}
}


//	Interstage RCS
@PART[ZQ3InterstageRCS]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.63636
	@title = Zhuque-3 Interstage RCS
	@manufacturer = #roMfrLS
	@mass = 0.05
	%skinTempTag = Steel
	%internalTempTag = Steel
	@MODULE[ModuleRCSFX]
	{
		!resourceName = NULL
		@thrusterPower = 20
		!atmosphereCurve {}
		PROPELLANT
		{
			name = Nitrogen
			ratio = 1.0
		}
		atmosphereCurve
		{
			key = 0 165
			key = 1 100
		}
	}
	!RESOURCE,* {}
	MODULE
	{
		name = ModuleFuelTanks
		type = SM-IV
		volume = 500
		basemass = -1
		TANK
		{
			name = Nitrogen
			amount = 100000
			maxAmount = 100000
		}
	}
}


