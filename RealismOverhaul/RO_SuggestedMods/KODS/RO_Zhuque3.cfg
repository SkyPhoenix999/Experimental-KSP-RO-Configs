}


//	Fairing
@PART[ZQ3Fairing]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.63636
	@title = Zhuque-3 Fairing
	@manufacturer = #roMfrLS
	@mass = 0.1
	%ROSAFRescale = 1.63636
	%skinTempTag = Steel
	%internalTempTag = Steel
	@MODULE[ModuleSimpleAdjustableFairing]
	{
		@deploymentSpeed = 7.5
		@WALL
		{
			@mass = 0.586
		}
		@CONE
		{
			@mass = 0.214
		}
	}
}


