//	TQ-12
@PART[TQ12]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.63636
	%engineType = TQ12
}


//	TQ-15
@PART[TQ15]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.63636
