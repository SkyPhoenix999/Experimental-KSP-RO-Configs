//	Vulcan Main Tank
@PART[VulcanTank]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.542857
	@mass = 19.3
	@title = Vulcan Core Stage Tank
	@manufacturer = #roMfrULA
	@description = An even more massive tank for cryogenic propellants, this time coming with Liquid Methane and Liquid Oxygen to feed those hungry BE-4 engines.
	%skinTempTag = Aluminum
	%internalTempTag = Aluminum
	!RESOURCE,* {}
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[vulcanswitch]] {}
	!MODULE[ModuleFuelTanks],* {}
	MODULE
	{
		name = ModuleFuelTanks
		type = Cryogenic
		volume = 450073.8
		basemass = -1
		TANK
		{
			name = LqdMethane
			amount = 192901.63
			maxAmount = 192901.63
		}
		TANK
		{
			name = LqdOxygen
			amount = 257172.17
			maxAmount = 257172.17
		}
	}
}
@PART[VulcanTank]:AFTER[RealismOverhaul_Materials]
{
	//	Keeps overheating during nominal launch
	@maxTemp = 1000
	@skinMaxTemp = 1000
}


//	Vulcan Centaur III Interstage
@PART[VulcanAdapter]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.542857
	@mass = 1.5
	@title = Vulcan Centaur III Interstage
	@manufacturer = #roMfrULA
	@description = Adapter for attaching the Vulcan Core Stage to a Centaur III Upperstage.
	%skinTempTag = Aluminum
	%internalTempTag = Instruments
	@MODULE[ModuleDecouple]
	{
		@ejectionForce = 1500
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchLH2_Cover]]
	{
		@SUBTYPE[Centaur?II/III]
		{
			TRANSFORM
			{
				name = Centaur_PipeCover
				scaleOffset = 1.037037133, 1.037037133, 1.037037133
			}
			TRANSFORM
			{
				name = CentaurAdapter
				scaleOffset = 1.037037133, 1.037037133, 1.037037133
			}
		}
		@SUBTYPE[1?25m]
		{
			%title = Size 1
		}
		@SUBTYPE[1?5m]
		{
			%title = Size 2
		}
		@SUBTYPE[1?875m]
		{
			%title = Size 3
		}
		@SUBTYPE[2?5m]
		{
			%title = Size 4
		}
		@SUBTYPE[3?125m]
		{
			%title = Size 5
		}
	}
}


