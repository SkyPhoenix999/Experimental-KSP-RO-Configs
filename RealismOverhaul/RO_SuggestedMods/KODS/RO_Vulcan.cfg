//	GEM-63 and 63XL
!PART[KODSbluedog_AtlasV_GEM63]:NEEDS[Bluedog_DB] {}
+PART[KODSbluedog_AtlasV_GEM63]:FOR[RealismOverhaul]:NEEDS[!Bluedog_DB]
{
	@name = KODSbluedog_AtlasV_GEM63XL
	%RSSROConfig = True
	%rescaleFactor = 1.524
	%CoMOffset = 0.0, 2.0, 0.0 // Too much torque on separation
	@MODULE[ModuleEnginesFX],*
	{
		@runningEffectName = running
	}
	%engineType = GEM-63XL
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]] {}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = lengthSwitch
		affectDragCubes = True
		affectFARVoxels = True
		SUBTYPE
		{
			name = GEM63XL
			transform = GEM63XL
		}
	}
	MODULE
	{
		name = ModuleB9DisableTransform
		transform = GEM63
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		title = GEM-63XL Node Height Switch
		moduleID = nodeSwitch
		switcherDescription = Attach Node
		SUBTYPE
		{
			name = Atlas V
		}
		SUBTYPE
		{
			name = Vulcan
			NODE
			{
				name = GEMnode
				position = 0, 3.6706, 0.508353
			}
		}
	}
}
@PART[KODSbluedog_AtlasV_GEM63]:FOR[RealismOverhaul]:NEEDS[!Bluedog_DB]
{
	%RSSROConfig = True
	%rescaleFactor = 1.524
	@MODULE[ModuleEnginesFX],*
	{
		@runningEffectName = running
	}
	%engineType = GEM-63
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]] {}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = lengthSwitch
		affectDragCubes = True
		affectFARVoxels = True
		SUBTYPE
		{
			name = GEM63
			transform = GEM63
		}
	}
	MODULE
	{
		name = ModuleB9DisableTransform
		transform = GEM63XL
	}
}


//	BDB GEM-63XL Node Switch
@PART[KODSbluedog_AtlasV_GEM63XL|bluedog_AtlasV_GEM63XL]:FOR[RealismOverhaul]:NEEDS[Bluedog_DB]
