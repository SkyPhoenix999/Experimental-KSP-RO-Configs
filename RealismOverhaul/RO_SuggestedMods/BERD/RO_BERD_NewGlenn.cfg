//	BE-3U
@PART[BE3U]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.6
	@title = BE-3U
	%manufacturer = #roMfrBO

	@tags ^= :$: USA blue origin bo be-3u 3u liquid pump upper lqdhydrogen lqdoxygen

	%specLevel = operational

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator] {}
	!RESOURCE,*{}

	@MODULE[ModuleGimbal]
	{
		%gimbalRange = 4
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 8
	}

	MODULE
	{
		name = ModuleEngineConfigs
		origMass = 0.73
		configuration = BE-3U
		modded = false
		CONFIG
		{
			name = BE-3U
			specLevel = operational
			maxThrust = 778
			minThrust = 623
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7286
				DrawGauge = true
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2714
			}
			atmosphereCurve
			{
				key = 0 445
				key = 1 245
			}
			ullage = True
			ignitions = 10
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.500
			}

			// Insufficient data, just use BE-3PM data
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 9100		//Tested to 9100 seconds? Fairly simple and understressed engine, designed to be reused.
				ratedBurnTime = 644
				safeOverburn = true
				overburnPenalty = 1.0

				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				ignitionReliabilityStart = 0.988095
				ignitionReliabilityEnd = 0.997619
				cycleReliabilityStart = 0.977273
				cycleReliabilityEnd = 0.995455
			}
		}
		CONFIG
		{
			name = BE-3U Upgrade
			description = Higher thrust upgrade for the BE-3U being introduced on NG-3.
			specLevel = prototype
			maxThrust = 941.5
			minThrust = 623
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7286
				DrawGauge = true
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2714
			}
			atmosphereCurve
			{
				key = 0 445
				key = 1 245
			}
			ullage = True
			ignitions = 10
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.500
			}

			// Insufficient data, just use BE-3PM data
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 9100		//Tested to 9100 seconds? Fairly simple and understressed engine, designed to be reused.
				ratedBurnTime = 644
				safeOverburn = true
				overburnPenalty = 1.0

				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				ignitionReliabilityStart = 0.988095
				ignitionReliabilityEnd = 0.997619
				cycleReliabilityStart = 0.977273
				cycleReliabilityEnd = 0.995455
				techTransfer = BE-3U:50
			}
		}
	}
}


