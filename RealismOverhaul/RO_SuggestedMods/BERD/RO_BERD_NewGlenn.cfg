//	Interstage
@PART[GS1Interstage]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.6
    @manufacturer = #roMfrBO
    @description = Interstage Adapter to mount the First Stage of New Glenn to the Second Stage.
	@mass = 8
	%skinTempTag = RCC
	%internalTempTag = HotStructure
	!RESOURCE,* {}
	MODULE
	{
		name = ModuleFuelTanks
		volume = 500
		basemass = -1
		type = ServiceModule
	}
	RESOURCE
	{
		name = ElectricCharge
		amount = 5000
		maxAmount = 5000
	}
	@MODULE[ModuleDecouple]
	{
		@ejectionForce = 24000
	}
}


