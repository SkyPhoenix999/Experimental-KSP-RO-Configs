//	Big RCS
@PART[GlennRCSBig]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.6
	@manufacturer = #roMfrBO
	@description = Large ACS system for the New Glenn 1st stage, meant for use after stage separation for reorientation for descent and landing.
	@MODULE[ModuleRCSFX]
	{
		@thrusterPower = 6
		!resourceName = NULL
		PROPELLANT
		{
			name = HTP
			ratio = 1
		}
		PROPELLANT
		{
			name = Helium
			ratio = 11.25
			ignoreForIsp = True
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 200
			key = 1 150
		}
	}
}


