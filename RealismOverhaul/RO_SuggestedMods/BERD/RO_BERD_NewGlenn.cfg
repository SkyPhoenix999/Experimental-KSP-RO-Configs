//	BE-4U
@PART[BE4U]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.6
	%engineType = BE4
}
@PART[BE4U]:AFTER[RealismOverhaulEngines]
{
	@title = BE-4U
	@description = The BE-4U is an oxidizer-rich staged combustion methalox engine. Originally planned for the second stage of New Glenn, it was dropped in favor of a dual BE-3U powered second stage.
	@MODULE[ModuleEngineConfigs]
	{
		@configuration = BE-4U
		@CONFIG[BE-4]
		{
			@name = BE-4U
			@description = Cancelled variant of the BE-4 for use on the upper stage of New Glenn. Blue Origin has since switched New Glenn's upper stage to using twin BE-3Us and LH2.
			@specLevel = concept
			@maxThrust = 2872.65	//	Calc based on ISP increase from BE-4 Vac ISP (341 to 370)
			@minThrust = 1149.06
			@massMult = 1.4 // Complete Guess
			!atmosphereCurve {}
			atmosphereCurve
			{
				key = 0 370 // Ballpark for a methane ORSC Vacuum Engine
				key = 1 241 // Guess based on M1DVac ISP Ratio
			}
		}
		@CONFIG[BE-4*Subcooling*Upgrade*]
		{
			@name = BE-4U (Subcooling Upgrade)
			@description = Hypothetical upgrade to the BE-4U based on the planned subcooling upgrade to the BE-4.
			@specLevel = concept
			@maxThrust = 3453.56	//	Calc based on ISP increase from BE-4 Vac ISP (341 to 370)
			@minThrust = 1381.42
			@massMult = 1.4 // Complete Guess
			!atmosphereCurve {}
			atmosphereCurve
			{
				key = 0 370 // Ballpark for a methane ORSC Vacuum Engine
				key = 1 241 // Guess based on M1DVac ISP Ratio
			}
		}
	}
}


