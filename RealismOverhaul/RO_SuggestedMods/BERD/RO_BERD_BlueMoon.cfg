//	============================================
//	BERD Blue Moon
//	============================================


//	BE-7
@PART[BE7]:FOR[RealismOverhaul]:NEEDS[BERD]
{
	%RSSROConfig = True
	@rescaleFactor = 1.6
	%title = BE-7
	%manufacturer = #roMfrBO
	%description = The BE-7 (Blue Engine 7) is a hydrolox rocket engine developed by Blue Origin, using a Dual Expander Cycle.
	@tags ^= :$: USA blue origin bo be-3 liquid pump booster lqdhydrogen lqdoxygen
	%specLevel = prototype
	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
	}
	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator] {}
	!RESOURCE,*{}
	@MODULE[ModuleGimbal]
	{
		%gimbalRange = 6 // guess
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 8
	}
	MODULE
	{
		name = ModuleEngineConfigs
		origMass = 0.09
		configuration = BE-7
		modded = false
		CONFIG
		{
			name = BE-7
			minThrust = 8.9
			maxThrust = 44.5
			heatProduction = 160
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7631
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2369
			}
			atmosphereCurve
			{
				key = 0 452.8
				key = 1 100
			}
			// Using BE-3 TF Config
			TESTFLIGHT
			{
				testedBurnTime = 18000		//Tested to ~47 minutes, but can burn longer
				ratedBurnTime = 18000
				safeOverburn = true
				overburnPenalty = 1.0
				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				ignitionReliabilityStart = 0.984375
				ignitionReliabilityEnd = 0.996875
				cycleReliabilityStart = 0.970000
				cycleReliabilityEnd = 0.994000
			}
		}
	}
}


//	Antenna
@PART[BlueMoonAntenna]:FOR[RealismOverhaul]:NEEDS[BERD]
{
	%RSSROConfig = True
	%rescaleFactor = 1.6
	@title = Blue Moon Mk1 High Gain Antenna
	@manufacturer = #roMfrBO
	@description = High Gain Antenna for Blue Moon Mk1. Capable of transmissions from the lunar surface.
	@mass = 0.01
	%skinTempTag = Aluminum
	%internalTempTag = Instruments
	!MODULE[ModuleDataTransmitter],* {}
	MODULE
	{
		name = ModuleRealAntenna
		referenceGain = 1.5
		RFBand = K //	Default
	}
	MODULE
	{
		name = ModuleRealAntenna
		referenceGain = 1.5
		RFBand = X //	Default
	}
}


